# D Company ERP — Production stack for Oracle Cloud / any VM with Docker.
#
# Differences from dev docker-compose.yml:
#   - Caddy in front with auto-HTTPS (ports 80 + 443)
#   - Backend + frontend not exposed to the internet directly
#   - Postgres / Redis / MinIO bound to the internal Docker network
#   - Strong env values from .env
#   - Restart policies set to "unless-stopped" so the stack survives reboots
#   - Bounded Docker logs so a noisy service cannot fill the VPS disk
#
# Production deployment and upgrades must use the hardened installer:
#   sudo bash infra/scripts/install-on-vm.sh <domain> --maintenance-confirmed
# Direct `docker compose up`/`--build` is unsupported in production because it
# bypasses release provenance, preflight, quiesced backup, and rollback gates.

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 over QUIC
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-admin@dcompany.local}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Signed Android releases are copied here by the release operator after
      # local/CI signature and checksum verification. Caddy serves the files
      # directly; the backend never receives signing material or rewrites APKs.
      - ./releases/android:/srv/releases/android:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - edge

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: erp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend_data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        printf '%s\n' \
          'user default off' \
          "user erp_backend on >$${REDIS_PASSWORD} ~dcompany:* -@all +ping +eval +get +set +pttl +time +zremrangebyscore +zcard +zadd +pexpire +hset +expire +incr +incrby +ttl +del +hgetall +multi +exec +discard +select +client|setinfo" \
          > /run/redis-users.acl
        exec redis-server --aclfile /run/redis-users.acl
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli --user erp_backend ping | grep -qx PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend_data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: erp
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    # MinIO console intentionally not exposed publicly. SSH-tunnel if needed.
    networks:
      - backend_data

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-3.1.11}
        APP_REVISION: ${APP_REVISION:-unknown}
    restart: unless-stopped
    logging: *default-logging
    environment:
      ENV: prod
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
      # Safe only while backend has no published port and Caddy overwrites
      # forwarding headers. Do not expose backend:8000 with this trust policy.
      FORWARDED_ALLOW_IPS: "*"
      DATABASE_URL: ${DATABASE_URL}
      # Compose builds this URL from the dedicated hex-safe ACL password; do
      # not put an unauthenticated/shared Redis URL in production.
      REDIS_URL: redis://erp_backend:${REDIS_PASSWORD}@redis:6379/0
      CLIENT_HEARTBEAT_USER_LIMIT_PER_MINUTE: ${CLIENT_HEARTBEAT_USER_LIMIT_PER_MINUTE:-30}
      # Required, dedicated secret for physical-tablet pairing codes. The app
      # rejects a missing/default value in production; never reuse JWT_SECRET.
      REMOTE_ASSISTANCE_PAIRING_SECRET: ${REMOTE_ASSISTANCE_PAIRING_SECRET}
      REMOTE_ASSISTANCE_RELAY_SECRET: ${REMOTE_ASSISTANCE_RELAY_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      # v8 is the first build that understands terminal purposes and the
      # explicit Gaming Area -> Cafe POS handoff, so older clients are blocked.
      ANDROID_MIN_SUPPORTED_VERSION_CODE: ${ANDROID_MIN_SUPPORTED_VERSION_CODE:-8}
      # Fail safe when rollout policy is omitted: do not advertise a release
      # whose APK and integrity metadata may not have been published yet.
      ANDROID_LATEST_VERSION_CODE: ${ANDROID_LATEST_VERSION_CODE:-8}
      CLIENT_COMPATIBILITY_POLICY_REVISION: ${CLIENT_COMPATIBILITY_POLICY_REVISION:-1}
      ANDROID_UPDATE_ALLOWED_ORIGIN: ${ANDROID_UPDATE_ALLOWED_ORIGIN:-}
      # Global release registry authority is an explicit immutable identity
      # binding, not a tenant-local role. Empty is intentionally deny-all.
      ANDROID_RELEASE_CONTROLLER_BINDINGS: ${ANDROID_RELEASE_CONTROLLER_BINDINGS:-}
      ANDROID_UPDATE_URL: ${ANDROID_UPDATE_URL:-}
      ANDROID_LATEST_VERSION_NAME: ${ANDROID_LATEST_VERSION_NAME:-}
      ANDROID_UPDATE_RELEASE_NOTES: ${ANDROID_UPDATE_RELEASE_NOTES:-}
      ANDROID_UPDATE_APK_SHA256: ${ANDROID_UPDATE_APK_SHA256:-}
      ANDROID_UPDATE_APK_SIZE_BYTES: ${ANDROID_UPDATE_APK_SIZE_BYTES:-}
      ANDROID_UPDATE_SIGNING_CERT_SHA256: ${ANDROID_UPDATE_SIGNING_CERT_SHA256:-}
      IOS_MIN_SUPPORTED_VERSION_CODE: ${IOS_MIN_SUPPORTED_VERSION_CODE:-1}
      IOS_LATEST_VERSION_CODE: ${IOS_LATEST_VERSION_CODE:-1}
      IOS_UPDATE_URL: ${IOS_UPDATE_URL:-}
      CLIENT_UPDATE_MESSAGE: ${CLIENT_UPDATE_MESSAGE:-}
      REQUIRE_NATIVE_VERSION_HEADERS: ${REQUIRE_NATIVE_VERSION_HEADERS:-true}
      ACCOUNT_SECURITY_EMAIL: ${ACCOUNT_SECURITY_EMAIL:-business@retrocafe.online}
      ACCOUNT_SECURITY_COMPANY_ID: ${ACCOUNT_SECURITY_COMPANY_ID:-}
      ACCOUNT_OTP_TTL_MINUTES: ${ACCOUNT_OTP_TTL_MINUTES:-10}
      ACCOUNT_OTP_MAX_ATTEMPTS: ${ACCOUNT_OTP_MAX_ATTEMPTS:-5}
      ACCOUNT_OTP_REQUEST_LIMIT: ${ACCOUNT_OTP_REQUEST_LIMIT:-3}
      EXPOSE_DOCS: ${EXPOSE_DOCS:-false}
      CORS_ORIGINS: ${CORS_ORIGINS}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_REGION: ${S3_REGION}
      S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      DEFAULT_CURRENCY: INR
      DEFAULT_TIMEZONE: Asia/Kolkata
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Kolkata}
      PUBLIC_URL: ${PUBLIC_URL:-https://dcompany.duckdns.org}
      REPORT_RECIPIENT_EMAILS: ${REPORT_RECIPIENT_EMAILS:-}
      ALERT_RECIPIENT_EMAILS: ${ALERT_RECIPIENT_EMAILS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
      FROM_NAME: ${FROM_NAME:-D Company ERP}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Backend NOT bound to host — only Caddy can reach it.
    networks:
      - edge
      - backend_data

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        VITE_API_URL: https://${DOMAIN}/api/v1
        VITE_APP_VERSION: ${APP_VERSION:-3.1.11}
        APP_VERSION: ${APP_VERSION:-3.1.11}
        APP_REVISION: ${APP_REVISION:-unknown}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
    # Frontend NOT bound to host either.
    networks:
      - edge

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:

networks:
  edge:
  backend_data:
    internal: true
