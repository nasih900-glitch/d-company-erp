name: Scan production container images
description: Generate SBOMs and fail on high or critical vulnerabilities in exact local images.

inputs:
  backend-image:
    description: Exact locally built backend image tag.
    required: true
  frontend-image:
    description: Exact locally built frontend image tag.
    required: true
  caddy-image:
    description: Exact locally built Caddy image tag.
    required: true
  postgres-image:
    description: Exact locally built PostgreSQL image tag.
    required: true
  redis-image:
    description: Exact locally built Redis image tag.
    required: true
  artifact-prefix:
    description: Unique prefix for the retained security evidence.
    required: true
  source-git-sha:
    description: Full source commit used to build the five local release images.
    required: true
  docker-host:
    description: Exact Unix socket URI returned by the pinned setup-Docker action.
    required: true
  docker-store:
    description: Expected disposable daemon image store (classic or containerd).
    required: true
  docker-root:
    description: Exact disposable daemon data root for this image lane.
    required: true

runs:
  using: composite
  steps:
    - name: Fail closed on runner/root Docker connection drift
      id: docker-connection
      shell: bash
      env:
        EXPECTED_DOCKER_HOST: ${{ inputs.docker-host }}
        EXPECTED_DOCKER_STORE: ${{ inputs.docker-store }}
        EXPECTED_DOCKER_ROOT: ${{ inputs.docker-root }}
      run: |
        set -euo pipefail
        bash "$GITHUB_ACTION_PATH/../../../infra/scripts/run-ci-docker-connection-check.sh" \
          "$EXPECTED_DOCKER_HOST" "$EXPECTED_DOCKER_STORE" "$EXPECTED_DOCKER_ROOT" \
          "$RUNNER_TEMP/container-security/docker-connection-pre-scan.json"

    - name: Record exact image identities
      if: ${{ !cancelled() && steps.docker-connection.outcome == 'success' }}
      shell: bash
      env:
        BACKEND_IMAGE: ${{ inputs.backend-image }}
        FRONTEND_IMAGE: ${{ inputs.frontend-image }}
        CADDY_IMAGE: ${{ inputs.caddy-image }}
        POSTGRES_IMAGE: ${{ inputs.postgres-image }}
        REDIS_IMAGE: ${{ inputs.redis-image }}
        SOURCE_GIT_SHA: ${{ inputs.source-git-sha }}
      run: |
        set -euo pipefail
        evidence_dir="$RUNNER_TEMP/container-security"
        mkdir -p "$evidence_dir"
        {
          echo "source_git_sha=$SOURCE_GIT_SHA"
          echo "recorded_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "backend_image=$BACKEND_IMAGE"
          docker image inspect --format 'backend_image_id={{.Id}}' "$BACKEND_IMAGE"
          echo "frontend_image=$FRONTEND_IMAGE"
          docker image inspect --format 'frontend_image_id={{.Id}}' "$FRONTEND_IMAGE"
          echo "caddy_image=$CADDY_IMAGE"
          docker image inspect --format 'caddy_image_id={{.Id}}' "$CADDY_IMAGE"
          echo "postgres_image=$POSTGRES_IMAGE"
          docker image inspect --format 'postgres_image_id={{.Id}}' "$POSTGRES_IMAGE"
          echo "redis_image=$REDIS_IMAGE"
          docker image inspect --format 'redis_image_id={{.Id}}' "$REDIS_IMAGE"
        } > "$evidence_dir/image-identities.txt"

    - name: Generate backend image SBOM
      if: ${{ !cancelled() && steps.docker-connection.outcome == 'success' }}
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        image: ${{ inputs.backend-image }}
        syft-version: v1.42.3
        format: spdx-json
        output-file: ${{ runner.temp }}/container-security/backend.spdx.json
        upload-artifact: false
        upload-release-assets: false
        dependency-snapshot: false

    - name: Generate frontend image SBOM
      if: ${{ !cancelled() && steps.docker-connection.outcome == 'success' }}
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        image: ${{ inputs.frontend-image }}
        syft-version: v1.42.3
        format: spdx-json
        output-file: ${{ runner.temp }}/container-security/frontend.spdx.json
        upload-artifact: false
        upload-release-assets: false
        dependency-snapshot: false

    - name: Generate Caddy image SBOM
      if: ${{ !cancelled() && steps.docker-connection.outcome == 'success' }}
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        image: ${{ inputs.caddy-image }}
        syft-version: v1.42.3
        format: spdx-json
        output-file: ${{ runner.temp }}/container-security/caddy.spdx.json
        upload-artifact: false
        upload-release-assets: false
        dependency-snapshot: false

    - name: Generate PostgreSQL image SBOM
      if: ${{ !cancelled() && steps.docker-connection.outcome == 'success' }}
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        image: ${{ inputs.postgres-image }}
        syft-version: v1.42.3
        format: spdx-json
        output-file: ${{ runner.temp }}/container-security/postgres.spdx.json
        upload-artifact: false
        upload-release-assets: false
        dependency-snapshot: false

    - name: Generate Redis image SBOM
      if: ${{ !cancelled() && steps.docker-connection.outcome == 'success' }}
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        image: ${{ inputs.redis-image }}
        syft-version: v1.42.3
        format: spdx-json
        output-file: ${{ runner.temp }}/container-security/redis.spdx.json
        upload-artifact: false
        upload-release-assets: false
        dependency-snapshot: false

    # The five locally built images additionally run through the exact
    # hardened archive scanner used by the production installer. Its Syft JSON
    # preserves source image IDs and its bounded mounts exercise the VM path.
    - name: Exercise hardened archive scanner on all candidate images
      id: hardened-scan
      if: ${{ !cancelled() && steps.docker-connection.outcome == 'success' }}
      shell: bash
      env:
        BACKEND_IMAGE: ${{ inputs.backend-image }}
        FRONTEND_IMAGE: ${{ inputs.frontend-image }}
        CADDY_IMAGE: ${{ inputs.caddy-image }}
        POSTGRES_IMAGE: ${{ inputs.postgres-image }}
        REDIS_IMAGE: ${{ inputs.redis-image }}
        SOURCE_GIT_SHA: ${{ inputs.source-git-sha }}
        EXPECTED_DOCKER_HOST: ${{ inputs.docker-host }}
        EXPECTED_DOCKER_STORE: ${{ inputs.docker-store }}
        EXPECTED_DOCKER_ROOT: ${{ inputs.docker-root }}
      run: |
        set -euo pipefail
        evidence_dir="$RUNNER_TEMP/container-security"
        # Keep retained root-private scanner state outside the recursively
        # uploaded evidence directory. Safe reports are copied below.
        scanner_evidence="$RUNNER_TEMP/dcompany-hardened-scanner-private"
        scanner_work="$scanner_evidence/scanner-work"
        scanner_tool="$GITHUB_ACTION_PATH/../../../infra/scripts/run-hardened-image-scanners.sh"
        syft_image='anchore/syft:v1.42.3@sha256:5999d209a342e55e9edf70bf8930fb5b86d8f2a783fa401178372c50e21b1d36'
        grype_image='anchore/grype:v0.118.0@sha256:8a93fc48da96bd6ec5981279d099b69de11541dc68fdf222fb9161f8ff284af7'
        # Pull before the helper's bounded docker-create calls so a cold
        # registry transfer cannot consume the container-creation deadline.
        timeout --foreground --signal TERM --kill-after=30s 600s docker pull "$syft_image"
        timeout --foreground --signal TERM --kill-after=30s 600s docker pull "$grype_image"
        runner_uid=$(id -u)
        runner_gid=$(id -g)
        mkdir "$scanner_evidence"
        chmod 700 "$scanner_evidence"
        mkdir "$scanner_work"
        chmod 700 "$scanner_work"
        metadata="$scanner_evidence/hardened-scan-metadata.txt"
        printf 'source_git_sha=%s\nscanned_at_utc=%s\n' \
          "$SOURCE_GIT_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$metadata"
        chmod 600 "$metadata"
        connection_check="$GITHUB_ACTION_PATH/../../../infra/scripts/run-ci-docker-connection-check.sh"
        bash "$connection_check" \
          "$EXPECTED_DOCKER_HOST" "$EXPECTED_DOCKER_STORE" "$EXPECTED_DOCKER_ROOT" \
          "$evidence_dir/docker-connection-before-hardened.json"
        services=(backend frontend caddy postgres redis)
        images=("$BACKEND_IMAGE" "$FRONTEND_IMAGE" "$CADDY_IMAGE" "$POSTGRES_IMAGE" "$REDIS_IMAGE")
        image_ids=()
        archives=()
        scanner_arguments=()
        for index in "${!services[@]}"; do
          service=${services[$index]}
          image=${images[$index]}
          image_id=$(docker image inspect --format '{{.Id}}' "$image")
          if ! [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Candidate $service image has no immutable ID." >&2
            exit 1
          fi
          archive="$scanner_evidence/$service-image.tar"
          docker image save "$image" --output "$archive"
          test -s "$archive"
          chmod 0444 "$archive"
          printf '%s_image_ref=%s\n%s_image_id=%s\n%s_archive_sha256=%s\n' \
            "$service" "$image" "$service" "$image_id" "$service" \
            "$(sha256sum "$archive" | awk '{print $1}')" >> "$metadata"
          image_ids+=("$image_id")
          archives+=("$archive")
          scanner_arguments+=(
            "$service" "$image" "$image_id" "$archive"
            "$scanner_evidence/$service.syft.json"
            "$scanner_evidence/$service-hardened-grype.json"
          )
        done
        sudo chown -R root:root "$scanner_evidence"
        scan_status=0
        docker_cli=$(realpath "$(command -v docker)")
        docker_cli_dir=$(dirname "$docker_cli")
        sudo /usr/bin/env -i \
          "PATH=$docker_cli_dir:/usr/sbin:/usr/bin:/sbin:/bin" \
          "DOCKER_HOST=$EXPECTED_DOCKER_HOST" \
          HOME=/root LC_ALL=C \
          /bin/bash "$scanner_tool" \
            "$scanner_work" "$metadata" "$syft_image" "$grype_image" \
            "${image_ids[0]}" "${scanner_arguments[@]}" || scan_status=$?
        if [ "$scan_status" -eq 0 ]; then
          if ! sudo /usr/bin/env -i \
            PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C \
            /usr/bin/python3 - "$metadata" "$EXPECTED_DOCKER_STORE" \
            "${services[@]}" > "$evidence_dir/archive-shape-summary.txt" <<'PY'
        import re
        import sys
        from pathlib import Path

        metadata = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
        store = sys.argv[2]
        services = sys.argv[3:]
        values: dict[str, list[str]] = {}
        for line in metadata:
            if "=" in line:
                key, value = line.split("=", 1)
                values.setdefault(key, []).append(value)

        def one(key: str) -> str:
            observed = values.get(key, [])
            if len(observed) != 1:
                raise SystemExit(f"archive shape evidence requires one {key}")
            return observed[0]

        digest = re.compile(r"sha256:[0-9a-f]{64}").fullmatch
        for service in services:
            runtime = one(f"{service}_runtime_image_id")
            runtime_type = one(f"{service}_runtime_image_id_type")
            manifest = one(f"{service}_runnable_manifest_digest")
            config = one(f"{service}_scanner_config_image_id")
            archive_digest = one(f"{service}_verified_archive_digest")
            platform = one(f"{service}_archive_platform")
            if not digest(runtime) or not digest(config) or not digest(archive_digest):
                raise SystemExit(f"invalid digest evidence for {service}")
            if platform != "linux/amd64":
                raise SystemExit(f"invalid archive platform for {service}")
            if store == "classic":
                if runtime_type != "config" or runtime != config:
                    raise SystemExit(f"classic archive identity mismatch for {service}")
            elif store == "containerd":
                if runtime_type != "oci-index" or runtime == config or not digest(manifest):
                    raise SystemExit(f"containerd archive identity/attestation shape mismatch for {service}")
            else:
                raise SystemExit("invalid expected Docker store")
            print(f"{service}_runtime_image_id_type={runtime_type}")
            print(f"{service}_runtime_image_id={runtime}")
            print(f"{service}_runnable_manifest_digest={manifest}")
            print(f"{service}_scanner_config_image_id={config}")
            print(f"{service}_verified_archive_digest={archive_digest}")
            print(f"{service}_archive_platform={platform}")
        PY
          then
            scan_status=1
          fi
        fi
        for index in "${!services[@]}"; do
          service=${services[$index]}
          if [ "$(docker image inspect --format '{{.Id}}' "${images[$index]}")" \
            != "${image_ids[$index]}" ]; then
            echo "Candidate $service tag changed during hardened scanning." >&2
            scan_status=1
          fi
        done
        if ! bash "$connection_check" \
          "$EXPECTED_DOCKER_HOST" "$EXPECTED_DOCKER_STORE" "$EXPECTED_DOCKER_ROOT" \
          "$evidence_dir/docker-connection-after-hardened.json"; then
          scan_status=1
        fi
        for evidence in hardened-scan-metadata.txt \
          backend.syft.json backend-hardened-grype.json \
          frontend.syft.json frontend-hardened-grype.json \
          caddy.syft.json caddy-hardened-grype.json \
          backend-zlib-runtime.raw.json backend-zlib-runtime.json \
          frontend-zlib-runtime.raw.json frontend-zlib-runtime.json \
          caddy-zlib-runtime.raw.json caddy-zlib-runtime.json \
          postgres-zlib-runtime.raw.json postgres-zlib-runtime.json \
          redis-zlib-runtime.raw.json redis-zlib-runtime.json \
          backend-grype-unfiltered.json backend-hashlib-runtime.json backend-hashlib-fixed.openvex.json \
          backend-openssl-runtime.json backend-openssl-reviewed.openvex.json \
          backend-grype-openssl-filtered.json backend-reviewed.openvex.json \
          caddy-grype-unfiltered.json caddy-openssl-runtime.raw.txt caddy-openssl-runtime.json \
          caddy-openssl-runtime-probe.sh caddy-openssl-reviewed.openvex.json \
          frontend-grype-unfiltered.json frontend-openssl-runtime.raw.txt frontend-openssl-runtime.json \
          frontend-openssl-runtime-probe.sh frontend-openssl-reviewed.openvex.json \
          postgres-grype-unfiltered.json postgres-openssl-runtime.raw.txt postgres-openssl-runtime.json \
          postgres-openssl-runtime-probe.sh postgres-openssl-reviewed.openvex.json \
          postgres.syft.json postgres-hardened-grype.json \
          redis.syft.json redis-hardened-grype.json; do
          if sudo test -f "$scanner_evidence/$evidence"; then
            sudo install -o "$runner_uid" -g "$runner_gid" -m 0600 \
              "$scanner_evidence/$evidence" "$evidence_dir/$evidence"
          fi
        done
        if [ "$scan_status" -ne 0 ]; then
          echo "Hardened candidate archive scanning failed; archives remain in its private runtime." >&2
          exit "$scan_status"
        fi
        for archive in "${archives[@]}"; do
          sudo rm -f "$archive"
        done
        for evidence in hardened-scan-metadata.txt \
          backend.syft.json backend-hardened-grype.json \
          frontend.syft.json frontend-hardened-grype.json \
          caddy.syft.json caddy-hardened-grype.json \
          backend-zlib-runtime.raw.json backend-zlib-runtime.json \
          frontend-zlib-runtime.raw.json frontend-zlib-runtime.json \
          caddy-zlib-runtime.raw.json caddy-zlib-runtime.json \
          postgres-zlib-runtime.raw.json postgres-zlib-runtime.json \
          redis-zlib-runtime.raw.json redis-zlib-runtime.json \
          backend-grype-unfiltered.json backend-hashlib-runtime.json backend-hashlib-fixed.openvex.json \
          backend-openssl-runtime.json backend-openssl-reviewed.openvex.json \
          backend-grype-openssl-filtered.json backend-reviewed.openvex.json \
          caddy-grype-unfiltered.json caddy-openssl-runtime.raw.txt caddy-openssl-runtime.json \
          caddy-openssl-runtime-probe.sh caddy-openssl-reviewed.openvex.json \
          frontend-grype-unfiltered.json frontend-openssl-runtime.raw.txt frontend-openssl-runtime.json \
          frontend-openssl-runtime-probe.sh frontend-openssl-reviewed.openvex.json \
          postgres-grype-unfiltered.json postgres-openssl-runtime.raw.txt postgres-openssl-runtime.json \
          postgres-openssl-runtime-probe.sh postgres-openssl-reviewed.openvex.json \
          postgres.syft.json postgres-hardened-grype.json \
          redis.syft.json redis-hardened-grype.json; do
          sudo rm -f "$scanner_evidence/$evidence"
        done
        sudo rmdir "$scanner_work"
        sudo rmdir "$scanner_evidence"

    # Keep SPDX SBOMs as retained audit evidence. All five exact official
    # fixed APKs require direct SBOM and immutable per-service runtime proof.
    - name: Select the independently verified backend fix statement
      id: backend-hashlib-vex
      if: ${{ !cancelled() && steps.hardened-scan.outcome == 'success' }}
      shell: bash
      run: |
        set -euo pipefail
        evidence_dir="$RUNNER_TEMP/container-security"
        vex="$evidence_dir/backend-hashlib-fixed.openvex.json"
        validate_evidence_hash() {
          local key=$1 file=$2 expected
          [ -f "$file" ] && [ ! -L "$file" ]
          expected=$(sed -n "s/^backend_hashlib_${key}_sha256=//p" "$evidence_dir/hardened-scan-metadata.txt")
          [[ "$expected" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$expected" "$file" | sha256sum -c -
        }
        validate_evidence_hash runtime_proof "$evidence_dir/backend-hashlib-runtime.json"
        if [ -e "$vex" ] || [ -L "$vex" ]; then
          validate_evidence_hash raw_grype "$evidence_dir/backend-grype-unfiltered.json"
          validate_evidence_hash vex "$vex"
          printf 'path=%s\n' "$vex" >> "$GITHUB_OUTPUT"
          scan_vex="$vex"
          combined="$evidence_dir/backend-reviewed.openvex.json"
          if [ -e "$combined" ] || [ -L "$combined" ]; then
            for binding in runtime_proof:backend-openssl-runtime.json vex:backend-openssl-reviewed.openvex.json combined_vex:backend-reviewed.openvex.json; do
              key=${binding%%:*}; file="$evidence_dir/${binding#*:}"
              [ -f "$file" ] && [ ! -L "$file" ]
              expected=$(sed -n "s/^backend_openssl_${key}_sha256=//p" "$evidence_dir/hardened-scan-metadata.txt")
              [[ "$expected" =~ ^[a-f0-9]{64}$ ]]
              printf '%s  %s\n' "$expected" "$file" | sha256sum -c -
            done
            validate_evidence_hash assessed_grype "$evidence_dir/backend-grype-openssl-filtered.json"
            scan_vex="$combined"
            printf 'openssl_path=%s\n' "$combined" >> "$GITHUB_OUTPUT"
          elif [ -e "$evidence_dir/backend-openssl-reviewed.openvex.json" ] || \
               grep -q '^backend_openssl_' "$evidence_dir/hardened-scan-metadata.txt"; then
            echo "Incomplete backend OpenSSL assessment evidence." >&2; exit 1
          fi
          printf 'scan_path=%s\n' "$scan_vex" >> "$GITHUB_OUTPUT"
        elif [ -e "$evidence_dir/backend-grype-unfiltered.json" ] || \
             grep -q '^backend_hashlib_vex_sha256=' "$evidence_dir/hardened-scan-metadata.txt"; then
          echo "Incomplete verified hashlib assessment evidence." >&2
          exit 1
        fi

    - name: Select separately verified service execution-path statements
      id: service-openssl-vex
      if: ${{ !cancelled() && steps.hardened-scan.outcome == 'success' }}
      shell: bash
      run: |
        set -euo pipefail
        evidence_dir="$RUNNER_TEMP/container-security"
        for service in caddy frontend postgres; do
          vex="$evidence_dir/$service-openssl-reviewed.openvex.json"
          if [ -e "$vex" ] || [ -L "$vex" ]; then
            for binding in runtime_proof:openssl-runtime.json raw_grype:grype-unfiltered.json vex:openssl-reviewed.openvex.json; do
              key=${binding%%:*}; file="$evidence_dir/$service-${binding#*:}"
              [ -f "$file" ] && [ ! -L "$file" ]
              expected=$(sed -n "s/^${service}_openssl_${key}_sha256=//p" "$evidence_dir/hardened-scan-metadata.txt")
              [[ "$expected" =~ ^[a-f0-9]{64}$ ]]
              printf '%s  %s\n' "$expected" "$file" | sha256sum -c -
            done
            printf '%s_path=%s\n' "$service" "$vex" >> "$GITHUB_OUTPUT"
          elif [ -e "$evidence_dir/$service-grype-unfiltered.json" ] || \
               grep -q "^${service}_openssl_" "$evidence_dir/hardened-scan-metadata.txt"; then
            echo "Incomplete service OpenSSL assessment evidence." >&2; exit 1
          fi
        done

    - name: Scan backend image
      if: ${{ !cancelled() && steps.hardened-scan.outcome == 'success' }}
      uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      with:
        image: ${{ inputs.backend-image }}
        grype-version: v0.118.0
        fail-build: true
        severity-cutoff: high
        only-fixed: false
        output-format: json
        output-file: ${{ runner.temp }}/container-security/backend-grype.json
        vex: ${{ steps.backend-hashlib-vex.outputs.scan_path }}

    - name: Scan frontend image
      if: ${{ !cancelled() && steps.hardened-scan.outcome == 'success' }}
      uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      with:
        image: ${{ inputs.frontend-image }}
        grype-version: v0.118.0
        fail-build: true
        severity-cutoff: high
        only-fixed: false
        output-format: json
        output-file: ${{ runner.temp }}/container-security/frontend-grype.json
        vex: ${{ steps.service-openssl-vex.outputs.frontend_path }}

    - name: Scan Caddy image
      if: ${{ !cancelled() && steps.hardened-scan.outcome == 'success' }}
      uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      with:
        image: ${{ inputs.caddy-image }}
        grype-version: v0.118.0
        fail-build: true
        severity-cutoff: high
        only-fixed: false
        output-format: json
        output-file: ${{ runner.temp }}/container-security/caddy-grype.json
        vex: ${{ steps.service-openssl-vex.outputs.caddy_path }}

    - name: Scan PostgreSQL image
      if: ${{ !cancelled() && steps.hardened-scan.outcome == 'success' }}
      uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      with:
        image: ${{ inputs.postgres-image }}
        grype-version: v0.118.0
        fail-build: true
        severity-cutoff: high
        only-fixed: false
        output-format: json
        output-file: ${{ runner.temp }}/container-security/postgres-grype.json
        vex: ${{ steps.service-openssl-vex.outputs.postgres_path }}

    - name: Scan Redis image
      if: ${{ !cancelled() && steps.hardened-scan.outcome == 'success' }}
      uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      with:
        image: ${{ inputs.redis-image }}
        grype-version: v0.118.0
        fail-build: true
        severity-cutoff: high
        only-fixed: false
        output-format: json
        output-file: ${{ runner.temp }}/container-security/redis-grype.json

    - name: Validate exact zlib evidence
      if: ${{ !cancelled() && steps.hardened-scan.outcome == 'success' }}
      shell: bash
      env:
        BACKEND_IMAGE: ${{ inputs.backend-image }}
        FRONTEND_IMAGE: ${{ inputs.frontend-image }}
        CADDY_IMAGE: ${{ inputs.caddy-image }}
        POSTGRES_IMAGE: ${{ inputs.postgres-image }}
        REDIS_IMAGE: ${{ inputs.redis-image }}
        VERIFIED_HASHLIB_VEX: ${{ steps.backend-hashlib-vex.outputs.path }}
        VERIFIED_OPENSSL_VEX: ${{ steps.backend-hashlib-vex.outputs.openssl_path }}
        VERIFIED_CADDY_VEX: ${{ steps.service-openssl-vex.outputs.caddy_path }}
        VERIFIED_FRONTEND_VEX: ${{ steps.service-openssl-vex.outputs.frontend_path }}
        VERIFIED_POSTGRES_VEX: ${{ steps.service-openssl-vex.outputs.postgres_path }}
      run: |
        set -euo pipefail
        evidence_dir="$RUNNER_TEMP/container-security"
        identities="$evidence_dir/image-identities.txt"
        hardened_metadata="$evidence_dir/hardened-scan-metadata.txt"
        verifier="$GITHUB_ACTION_PATH/../../../infra/scripts/verify-zlib-vex.py"
        services=(backend frontend caddy postgres redis)
        images=("$BACKEND_IMAGE" "$FRONTEND_IMAGE" "$CADDY_IMAGE" "$POSTGRES_IMAGE" "$REDIS_IMAGE")
        validation="$evidence_dir/zlib-evidence-validation.txt"
        : > "$validation"
        for index in "${!services[@]}"; do
          service=${services[$index]}
          image=${images[$index]}
          mapfile -t runtime_ids < <(awk -F= -v key="${service}_image_id" \
            '$1 == key {print substr($0, index($0, "=") + 1)}' "$identities")
          mapfile -t config_ids < <(awk -F= -v key="${service}_scanner_config_image_id" \
            '$1 == key {print substr($0, index($0, "=") + 1)}' "$hardened_metadata")
          mapfile -t archive_platforms < <(awk -F= -v key="${service}_archive_platform" \
            '$1 == key {print substr($0, index($0, "=") + 1)}' "$hardened_metadata")
          if [ "${#runtime_ids[@]}" -ne 1 ] || \
             [ "${#config_ids[@]}" -ne 1 ] || \
             [ "${#archive_platforms[@]}" -ne 1 ] || [ "${archive_platforms[0]}" != linux/amd64 ] || \
             ! [[ "${runtime_ids[0]}" =~ ^sha256:[0-9a-f]{64}$ ]] || \
             ! [[ "${config_ids[0]}" =~ ^sha256:[0-9a-f]{64}$ ]] || \
             [ "$(docker image inspect --format '{{.Id}}' "$image")" != "${runtime_ids[0]}" ]; then
            echo "Candidate $service identity changed before final zlib evidence validation." >&2
            exit 1
          fi
          hashlib_vex=()
          openssl_vex=()
          if [ "$service" = backend ] && [ -n "$VERIFIED_HASHLIB_VEX" ]; then
            [ "$VERIFIED_HASHLIB_VEX" = "$evidence_dir/backend-hashlib-fixed.openvex.json" ]
            hashlib_vex=("--hashlib-vex=$VERIFIED_HASHLIB_VEX")
            if [ -n "$VERIFIED_OPENSSL_VEX" ]; then
              [ "$VERIFIED_OPENSSL_VEX" = "$evidence_dir/backend-reviewed.openvex.json" ]
              openssl_vex=("--openssl-assessment=$VERIFIED_OPENSSL_VEX")
            fi
          fi
          case "$service" in
            caddy) service_vex=$VERIFIED_CADDY_VEX ;;
            frontend) service_vex=$VERIFIED_FRONTEND_VEX ;;
            postgres) service_vex=$VERIFIED_POSTGRES_VEX ;;
            *) service_vex="" ;;
          esac
          if [ -n "$service_vex" ]; then
            [ "$service_vex" = "$evidence_dir/$service-openssl-reviewed.openvex.json" ]
            openssl_vex=("--openssl-assessment=$service_vex")
          fi
          python3 "$verifier" \
            "--$service-fixed-sbom" "$evidence_dir/$service.syft.json" \
            "$image" "${config_ids[0]}" \
            "$service=$evidence_dir/$service-grype.json" \
            "--runtime-proof=$evidence_dir/$service-zlib-runtime.json" \
            "--archive-platform=${archive_platforms[0]}@${config_ids[0]}" "${hashlib_vex[@]}" "${openssl_vex[@]}" >> "$validation"
        done

    - name: Retain container security evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.artifact-prefix }}-container-security
        if-no-files-found: error
        retention-days: 30
        path: ${{ runner.temp }}/container-security/
