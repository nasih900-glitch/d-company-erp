name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r backend/requirements.txt
      - run: pip install ruff mypy pytest pytest-asyncio pytest-cov pip-audit
      # Blocking: pip-audit -r backend/requirements.lock passes clean (0 known vulns) as of 2026-07-21.
      # requirements.lock is the fully pinned 55-package closure that infra/docker/backend.Dockerfile
      # actually installs into the production image — it's what's deployed, so it's the gate.
      # No severity flag exists for pip-audit (unlike npm's --audit-level); it fails on any known vuln.
      - name: Dependency vulnerability scan (pip-audit, locked/deployed set)
        run: pip-audit -r backend/requirements.lock
      # Informational only: requirements.txt is the loose '>=' file pip-compile generates the lock
      # from, not what ships to prod. Kept here to catch drift early, but not blocking on its own.
      - name: Dependency vulnerability scan (pip-audit, loose requirements.txt, informational)
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt
      # NOTE: still advisory (continue-on-error) — ruff/mypy do not currently pass on this codebase
      # (995 ruff findings, 145 mypy errors as of 2026-07-19). Flipping these to blocking now would
      # break every CI run immediately. Fix the backlog first, then remove continue-on-error here.
      - name: Lint advisory
        continue-on-error: true
        run: cd backend && ruff check . && ruff format --check .
      - name: Type-check advisory
        continue-on-error: true
        run: cd backend && mypy app
      - name: Migrations apply cleanly
        env:
          DATABASE_URL: postgresql+psycopg://erp:erp@localhost:5432/erp_test
        run: cd backend && alembic upgrade head
      - name: Tests
        env:
          DATABASE_URL: postgresql+psycopg://erp:erp@localhost:5432/erp_test
          REDIS_URL: redis://localhost:6379/0
        run: cd backend && pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm install --no-audit --no-fund
      # Blocking: only prod dependencies are gated (--omit=dev). As of 2026-07-19, npm audit finds
      # real high/critical CVEs in vite/vitest, but both are devDependencies used only by the local
      # dev server and test runner — never built into or run by the shipped app. Blocking on those
      # would make CI permanently red over an accepted, non-exploitable-in-prod risk. Revisit by
      # upgrading vite/vitest during a routine dependency bump; `npm audit --audit-level=high`
      # (without --omit=dev) shows the full picture.
      - name: Dependency vulnerability scan (npm audit, prod deps)
        run: cd frontend && npm audit --omit=dev --audit-level=high
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run typecheck
      - run: cd frontend && npm run test
      - run: cd frontend && npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        run: docker build -f infra/docker/backend.Dockerfile -t erp-backend:ci .
      - name: Build frontend image
        run: docker build -f infra/docker/frontend.Dockerfile -t erp-frontend:ci .
