name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r backend/requirements.txt
      - run: pip install ruff mypy pytest pytest-asyncio pytest-cov pip-audit
      # Blocking: pip-audit -r backend/requirements.lock passes clean (0 known vulns) as of 2026-07-21.
      # requirements.lock is the fully pinned 55-package closure that infra/docker/backend.Dockerfile
      # actually installs into the production image — it's what's deployed, so it's the gate.
      # No severity flag exists for pip-audit (unlike npm's --audit-level); it fails on any known vuln.
      - name: Dependency vulnerability scan (pip-audit, locked/deployed set)
        run: pip-audit -r backend/requirements.lock
      # Informational only: requirements.txt is the loose '>=' file pip-compile generates the lock
      # from, not what ships to prod. Kept here to catch drift early, but not blocking on its own.
      - name: Dependency vulnerability scan (pip-audit, loose requirements.txt, informational)
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt
      # NOTE: still advisory (continue-on-error) — ruff/mypy do not currently pass on this codebase
      # (995 ruff findings, 145 mypy errors as of 2026-07-19). Flipping these to blocking now would
      # break every CI run immediately. Fix the backlog first, then remove continue-on-error here.
      - name: Lint advisory
        continue-on-error: true
        run: cd backend && ruff check . && ruff format --check .
      - name: Type-check advisory
        continue-on-error: true
        run: cd backend && mypy app
      - name: Migrations apply cleanly
        env:
          DATABASE_URL: postgresql+psycopg://erp:erp@localhost:5432/erp_test
        run: cd backend && alembic upgrade head
      - name: Tests
        env:
          DATABASE_URL: postgresql+psycopg://erp:erp@localhost:5432/erp_test
          REDIS_URL: redis://localhost:6379/0
        run: cd backend && pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci --no-audit --no-fund
      # Blocking: only prod dependencies are gated (--omit=dev). As of 2026-07-19, npm audit finds
      # real high/critical CVEs in vite/vitest, but both are devDependencies used only by the local
      # dev server and test runner — never built into or run by the shipped app. Blocking on those
      # would make CI permanently red over an accepted, non-exploitable-in-prod risk. Revisit by
      # upgrading vite/vitest during a routine dependency bump; `npm audit --audit-level=high`
      # (without --omit=dev) shows the full picture.
      - name: Dependency vulnerability scan (npm audit, prod deps)
        run: cd frontend && npm audit --omit=dev --audit-level=high
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run typecheck
      - run: cd frontend && npm run test
      - run: cd frontend && npm run build

  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Test Android release version guard
        run: python3 -m unittest discover -s tests -p 'test_android_release_version.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android-native/*.gradle.kts
            android-native/gradle.properties
            android-native/gradle/wrapper/gradle-wrapper.properties
            android-native/app/*.gradle.kts
      - uses: android-actions/setup-android@v3
      # Keep release and debug Kotlin compilation in separate Gradle processes.
      # A single combined invocation can compile both variants concurrently and
      # exhaust the 7 GB hosted-runner memory before instrumentation starts.
      - name: Build and lint Android release
        working-directory: android-native
        run: ./gradlew --no-daemon --max-workers=2 --stacktrace lintRelease assembleRelease bundleRelease
      - name: Run Android JVM tests
        working-directory: android-native
        run: ./gradlew --no-daemon --max-workers=2 --stacktrace testDebugUnitTest
      # Room migration tests need a real Android SQLite/Room runtime. Keeping
      # them blocking prevents a schema change from shipping an app that can no
      # longer open an existing tablet database.
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: cd android-native && ./gradlew --no-daemon --max-workers=2 --stacktrace connectedDebugAndroidTest
      - name: Upload Android test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-ci-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            android-native/app/build/reports/lint-results-*.html
            android-native/app/build/reports/tests/
            android-native/app/build/reports/androidTests/
            android-native/app/build/test-results/
            android-native/app/build/outputs/androidTest-results/

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        run: docker build -f infra/docker/backend.Dockerfile -t erp-backend:ci .
      - name: Build frontend image
        run: docker build -f infra/docker/frontend.Dockerfile -t erp-frontend:ci .
