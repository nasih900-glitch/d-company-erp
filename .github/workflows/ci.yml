name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r backend/requirements.txt
      - run: pip install ruff mypy pytest pytest-asyncio pytest-cov pip-audit
      # Blocking: audit the exact dependency set installed into the production image.
      # requirements.lock is the fully pinned closure that infra/docker/backend.Dockerfile
      # actually installs into the production image — it's what's deployed, so it's the gate.
      # No severity flag exists for pip-audit (unlike npm's --audit-level); it fails on any known vuln.
      - name: Dependency vulnerability scan (pip-audit, locked/deployed set)
        run: pip-audit -r backend/requirements.lock
      # Informational only: requirements.txt is the loose '>=' file pip-compile generates the lock
      # from, not what ships to prod. Kept here to catch drift early, but not blocking on its own.
      - name: Dependency vulnerability scan (pip-audit, loose requirements.txt, informational)
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt
      # NOTE: still advisory (continue-on-error) — ruff/mypy do not currently pass on this codebase
      # (995 ruff findings, 145 mypy errors as of 2026-07-19). Flipping these to blocking now would
      # break every CI run immediately. Fix the backlog first, then remove continue-on-error here.
      - name: Lint advisory
        continue-on-error: true
        run: cd backend && ruff check . && ruff format --check .
      - name: Type-check advisory
        continue-on-error: true
        run: cd backend && mypy app
      - name: Migrations apply cleanly
        env:
          DATABASE_URL: postgresql+psycopg://erp:erp@localhost:5432/erp_test
        run: cd backend && alembic upgrade head
      - name: Tests
        env:
          DATABASE_URL: postgresql+psycopg://erp:erp@localhost:5432/erp_test
          REDIS_URL: redis://localhost:6379/0
        run: cd backend && pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci --no-audit --no-fund
      # Gate both shipped dependencies and the build/test supply chain. Code 18
      # removed the temporary Code 17 Vite/Vitest exception, so a future
      # high/critical development-tool advisory must fail CI as well.
      - name: Dependency vulnerability scan (npm audit, full tree)
        run: cd frontend && npm audit --audit-level=high
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run typecheck
      - run: cd frontend && npm run test
      - run: cd frontend && npm run build

  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test Android release and server-delivery contracts
        run: python3 -m unittest discover -s tests -p 'test_android_release*.py'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android-native/*.gradle.kts
            android-native/gradle.properties
            android-native/gradle/wrapper/gradle-wrapper.properties
            android-native/app/*.gradle.kts
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      # Keep release and debug Kotlin compilation in separate Gradle processes.
      # A single combined invocation can compile both variants concurrently and
      # exhaust the 7 GB hosted-runner memory before instrumentation starts.
      - name: Build and lint Android release
        working-directory: android-native
        run: ./gradlew --no-daemon --max-workers=2 --stacktrace lintRelease assembleRelease bundleRelease
      - name: Run Android JVM tests
        working-directory: android-native
        run: ./gradlew --no-daemon --max-workers=2 --stacktrace testDebugUnitTest
      # GitHub's Linux runner exposes /dev/kvm, but the runner user is not
      # consistently granted access. Without KVM the API-35 emulator can take
      # several minutes to boot and the instrumentation process may be killed
      # before it discovers any tests.
      - name: Enable KVM for Android emulator
        run: |
          test -c /dev/kvm
          # The hosted runner already created /dev/kvm. Change that device
          # directly: udevadm trigger is not reliable in the runner container
          # and can exit 1 before applying an otherwise valid rule.
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      # Room migration tests need a real Android SQLite/Room runtime. Keeping
      # them blocking prevents a schema change from shipping an app that can no
      # longer open an existing tablet database.
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          # Instrumentation includes tablet reachability and density coverage.
          # The action's default 320x640 phone AVD clips those layouts before
          # Compose can scroll them; Pixel C keeps the suite on a real tablet
          # class viewport, matching the 1280x800dp production target closely.
          profile: pixel_c
          disable-animations: true
          script: bash scripts/run_android_instrumentation_ci.sh
      - name: Upload Android test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-native-ci-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            android-native/app/build/reports/lint-results-*.html
            android-native/app/build/reports/tests/
            android-native/app/build/reports/androidTests/
            android-native/app/build/test-results/
            android-native/app/build/outputs/androidTest-results/
            android-native/app/build/outputs/ci-diagnostics/

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Validate production Caddy routing
        run: >-
          docker run --rm
          -e DOMAIN=example.test
          -e ACME_EMAIL=admin@example.test
          -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build backend image
        run: docker build -f infra/docker/backend.Dockerfile -t erp-backend:ci .
      - name: Build frontend image
        run: docker build -f infra/docker/frontend.Dockerfile -t erp-frontend:ci .
