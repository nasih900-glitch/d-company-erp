name: QEMU loss diagnostic (not release acceptance)
on:
  push:
    branches: [codex/qemu-loss-diagnostic-3154-r1]
permissions:
  contents: read
jobs:
  observe-owned-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '36.5.10'
            build: '15081367'
          - version: '37.1.11'
            build: '15917651'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android-native/*.gradle.kts
            android-native/gradle.properties
            android-native/gradle/wrapper/gradle-wrapper.properties
            android-native/app/*.gradle.kts
            android-native/audit-driver/*.gradle.kts
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: platform-tools
      - name: Check probe controls without starting an emulator
        run: python3 -m unittest discover -s tests -p test_qemu_host_diagnostic.py -v
      - name: Enable KVM (same hosted UI lane prerequisite)
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Observe direct-child emulator and bounded Gradle workload
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          cores: 2
          profile: pixel_c
          force-avd-creation: true
          disable-animations: true
          emulator-build: ${{ matrix.build }}
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          pre-emulator-launch-script: python3 scripts/configure_ci_android_avd.py test
          script: python3 scripts/diagnose_android_emulator_host.py --version '${{ matrix.version }}' --build '${{ matrix.build }}'
      - name: Retain observed exit, resources and exact test inventories
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qemu-loss-diagnostic-${{ matrix.version }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            android-native/app/build/outputs/qemu-host-diagnostic/
            android-native/app/build/outputs/androidTest-results/
            android-native/app/build/reports/androidTests/
