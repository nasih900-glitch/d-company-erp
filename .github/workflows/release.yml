# Builds the supported Android release on a tag push (e.g. v3.1.0) and attaches
# the signed APK/AAB to a GitHub Release. Web production deploys are handled by
# the existing VPS deployment workflow, not by this installer workflow.
#
# Required GitHub secrets (set in repo → Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64         — release.keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Android signing secrets are mandatory. The Android job fails closed before
# building if any are absent, so an unsigned APK/AAB can never reach a release.

name: Release Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------- Android (.apk / .aab)
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify Android tag and source version
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_REF_TYPE" != "tag" ]; then
            echo "Android releases must run from a v* Git tag, not a branch." >&2
            exit 1
          fi
          python3 scripts/verify_android_release_version.py --tag "$RELEASE_REF"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android-native/*.gradle.kts
            android-native/gradle.properties
            android-native/gradle/wrapper/gradle-wrapper.properties
            android-native/app/*.gradle.kts
      - uses: android-actions/setup-android@v3
      - name: Require Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing required Android signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android-native/dcompany-release.keystore
          cat > android-native/keystore.properties <<EOF
          storeFile=dcompany-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          test -s android-native/dcompany-release.keystore
      # Bound workers and separate compilation-heavy release work from tests so
      # the hosted runner cannot start competing Kotlin compiler workloads.
      - name: Build and lint signed Android release
        working-directory: android-native
        run: ./gradlew --no-daemon --max-workers=2 --stacktrace lintRelease assembleRelease bundleRelease
      - name: Run Android release JVM tests
        working-directory: android-native
        run: ./gradlew --no-daemon --max-workers=2 --stacktrace testReleaseUnitTest
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: cd android-native && ./gradlew --no-daemon --max-workers=2 --stacktrace connectedDebugAndroidTest
      - name: Verify signatures and package release metadata
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          apk='android-native/app/build/outputs/apk/release/app-release.apk'
          aab='android-native/app/build/outputs/bundle/release/app-release.aab'
          metadata='android-native/app/build/outputs/apk/release/output-metadata.json'
          package_dir='android-native/app/build/outputs/release-package'
          safe_release_ref="$(printf '%s' "$RELEASE_REF" | sed 's/[^A-Za-z0-9._-]/-/g')"

          test -s "$apk"
          test -s "$aab"
          test -s "$metadata"
          test -n "$safe_release_ref"

          python3 scripts/verify_android_release_version.py \
            --tag "$RELEASE_REF" \
            --metadata "$metadata"

          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$apk"
          jarsigner -verify "$aab" > "$RUNNER_TEMP/aab-signature-verification.txt"
          grep -q '^jar verified\.$' "$RUNNER_TEMP/aab-signature-verification.txt"

          mkdir -p "$package_dir"
          cp "$apk" "$package_dir/d-company-erp-${safe_release_ref}.apk"
          cp "$aab" "$package_dir/d-company-erp-${safe_release_ref}.aab"
          cp "$metadata" "$package_dir/output-metadata.json"
          (
            cd "$package_dir"
            sha256sum ./*.apk ./*.aab > SHA256SUMS
          )

          export APK_PATH="$apk"
          export METADATA_PATH="$metadata"
          export MANIFEST_PATH="$package_dir/release-manifest.json"
          export SIGNING_CERT_SHA256
          SIGNING_CERT_SHA256="$(
            "$apksigner" verify --print-certs "$apk" |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
              head -1
          )"
          test -n "$SIGNING_CERT_SHA256"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path(os.environ["METADATA_PATH"]).read_text())
          element = metadata["elements"][0]
          manifest = {
              "application_id": metadata["applicationId"],
              "variant": metadata["variantName"],
              "version_code": element["versionCode"],
              "version_name": element["versionName"],
              "git_sha": os.environ["RELEASE_SHA"],
              "release_ref": os.environ["RELEASE_REF"],
              "workflow_run_id": os.environ["RELEASE_RUN_ID"],
              "workflow_run_attempt": os.environ["RELEASE_RUN_ATTEMPT"],
              "api_base_url": "https://dcompany.duckdns.org/api/v1/",
              "signing_certificate_sha256": os.environ["SIGNING_CERT_SHA256"],
          }
          Path(os.environ["MANIFEST_PATH"]).write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: android-native-release
          if-no-files-found: error
          retention-days: 30
          path: android-native/app/build/outputs/release-package/*
      - name: Upload Android test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-release-reports
          if-no-files-found: warn
          retention-days: 30
          path: |
            android-native/app/build/reports/lint-results-*.html
            android-native/app/build/reports/tests/
            android-native/app/build/reports/androidTests/
            android-native/app/build/test-results/
            android-native/app/build/outputs/androidTest-results/

  # -------------------------------------------------------- Release page
  release:
    needs: build-android
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'D Company ERP ${{ github.ref_name }}'
          generate_release_notes: true
          files: |
            artifacts/android-native-release/*
