name: Unsigned AAB reproducibility diagnostic
on:
  push:
    branches: [codex/aab-repro-diagnostic-3154-r1]
permissions:
  contents: read
  actions: read
jobs:
  rebuild-immutable-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check diagnostic controls and preserve tooling outside build root
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_android_aab_diagnostic.py -v
          mkdir -p "$RUNNER_TEMP/aab-repro"
          cp scripts/diagnose_android_aab_repro.py "$RUNNER_TEMP/aab-diagnostic.py"
          sha256sum "$RUNNER_TEMP/aab-diagnostic.py" > "$RUNNER_TEMP/aab-repro/diagnostic-script.sha256"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/aab-repro/diagnostic-commit.txt"
      # Build at exactly the same workspace root as the canonical job; the
      # diagnostic checkout must not become a nested build-source path.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 21b162e39737fca27f85176523c717c798ca8ac1
          clean: true
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify hosted Android SDK (same release setup)
        run: |
          test -n "${ANDROID_SDK_ROOT:-}"
          test -d "$ANDROID_SDK_ROOT"
      - name: Retain exact producer API identity without downloading a second ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/nasih900-glitch/d-company-erp/actions/artifacts/13279607444 > "$RUNNER_TEMP/aab-repro/producer-artifact-api.json"
          gh api repos/nasih900-glitch/d-company-erp/actions/runs/41727809348 > "$RUNNER_TEMP/aab-repro/producer-run-api.json"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '13279607444'
          run-id: '41727809348'
          repository: nasih900-glitch/d-company-erp
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/aab-producer
      - name: Verify immutable build root and eight independently fixed producer hashes
        run: python3 "$RUNNER_TEMP/aab-diagnostic.py" --producer "$RUNNER_TEMP/aab-producer" --output "$RUNNER_TEMP/aab-repro" --verify-only
      - name: Repeat the clean unsigned reproducer procedure without signing material
        timeout-minutes: 35
        run: |
          set -euo pipefail
          test ! -e android-native/keystore.properties
          test ! -e android-native/dcompany-release.keystore
          test ! -e android-native/app/build
          pwd > "$RUNNER_TEMP/aab-repro/build-workspace.txt"
          java -version 2> "$RUNNER_TEMP/aab-repro/java-version.txt"
          cd android-native
          gradle_release() {
            ./gradlew --no-daemon --max-workers=1 --stacktrace \
              --dependency-verification=strict \
              '-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8' \
              -Pkotlin.compiler.execution.strategy=in-process "$@"
          }
          gradle_release :app:assembleRelease :app:bundleRelease 2>&1 | tee "$RUNNER_TEMP/aab-repro/build-play.log"
          gradle_release :app:assembleDirectRelease 2>&1 | tee "$RUNNER_TEMP/aab-repro/build-direct.log"
      - name: Retain every available rebuilt payload and compare all seven before failing
        if: always()
        run: python3 "$RUNNER_TEMP/aab-diagnostic.py" --producer "$RUNNER_TEMP/aab-producer" --output "$RUNNER_TEMP/aab-repro"
      - name: Upload raw rebuilt outputs and ZIP/input-order evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aab-repro-diagnostic-21b162e
          if-no-files-found: warn
          retention-days: 14
          path: ${{ runner.temp }}/aab-repro/
