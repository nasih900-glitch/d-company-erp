name: Isolated build58 native diagnostics

on:
  push:
    branches: [codex/diagnostic58-native-r2]

permissions:
  contents: read
  actions: read

jobs:
  emulator-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        sequence: ['old-new', 'new-old']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: diagnostic-tools
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6eb61bf097afb7d6e306f3878a64f266adf451a1
          path: app-source
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: 'platform-tools system-images;android-35;default;x86_64'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '13110313000'
          run-id: '41372801504'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/debug-pair
      - name: Install demonstrated emulator runtime prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpulse0
          dpkg-query --show --showformat='${Package} ${Version}\n' libpulse0
      - name: Verify KVM access
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Run untraced, owned-process emulator comparison
        env:
          DIAGNOSTIC_SEQUENCE: ${{ matrix.sequence }}
        run: >-
          python3 diagnostic-tools/ops/diagnostic58/run_sequence.py
          --source app-source --pair "$RUNNER_TEMP/debug-pair"
          --sequence "$DIAGNOSTIC_SEQUENCE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: diagnostic58-emulator-${{ matrix.sequence }}
          path: ${{ runner.temp }}/emulator-observations
          if-no-files-found: warn
          retention-days: 7

