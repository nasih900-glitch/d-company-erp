name: Isolated build58 diagnostics

on:
  push:
    branches: [codex/diagnostic58-r1]

permissions:
  contents: read

jobs:
  build-experimental-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: diagnostic-tools
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6eb61bf097afb7d6e306f3878a64f266adf451a1
          path: app-source
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: app-source/android-native/**/*.gradle.kts
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - name: Build one isolated unchanged-source APK pair
        working-directory: app-source/android-native
        run: >-
          ./gradlew --no-daemon --max-workers=1 --dependency-verification=strict
          '-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8'
          -Pkotlin.compiler.execution.strategy=in-process
          -Pdcompany.debugApiBaseUrl=http://127.0.0.1:9/api/v1/
          :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Freeze exact debug pair and source
        run: python3 diagnostic-tools/ops/diagnostic58/package_pair.py app-source "$RUNNER_TEMP/debug-pair"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic58-debug-pair
          path: ${{ runner.temp }}/debug-pair
          if-no-files-found: error
          retention-days: 7

  emulator-comparison:
    needs: build-experimental-pair
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        sequence: ['old-new', 'new-old']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: diagnostic-tools
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6eb61bf097afb7d6e306f3878a64f266adf451a1
          path: app-source
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: 'platform-tools system-images;android-35;default;x86_64'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: diagnostic58-debug-pair
          path: ${{ runner.temp }}/debug-pair
      - name: Verify KVM access
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Run untraced, owned-process emulator comparison
        env:
          DIAGNOSTIC_SEQUENCE: ${{ matrix.sequence }}
        run: >-
          python3 diagnostic-tools/ops/diagnostic58/run_sequence.py
          --source app-source --pair "$RUNNER_TEMP/debug-pair"
          --sequence "$DIAGNOSTIC_SEQUENCE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: diagnostic58-emulator-${{ matrix.sequence }}
          path: ${{ runner.temp }}/emulator-observations
          if-no-files-found: warn
          retention-days: 7

  backend-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4.11-alpine3.21@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: diagnostic-tools
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6eb61bf097afb7d6e306f3878a64f266adf451a1
          path: app-source
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.10'
          cache: pip
          cache-dependency-path: app-source/backend/requirements-ci.lock
      - name: Install frozen backend test dependencies
        working-directory: app-source
        run: |
          python -I -B infra/scripts/bootstrap-verified-pip.py
          python -m pip install --only-binary=:all: --require-hashes -r backend/requirements-ci.lock
          python -m pip install --only-binary=:all: --require-hashes -r ops/backup-requirements.lock
          python -m pip_audit -r backend/requirements.lock
          python -m pip_audit -r backend/requirements-ci.lock
          python -m pip_audit -r ops/backup-requirements.lock
      - name: Verify installer-lock prerequisite
        working-directory: app-source
        run: |
          test -n "$pythonLocation"
          sudo -n -- "$pythonLocation/bin/python" tests/verify_production_installer_lock_metadata.py
      - name: Install PostgreSQL16 and contract prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep postgresql-client-16
      - name: Select exact PostgreSQL16 clients and pinned Redis
        working-directory: app-source
        run: |
          bash infra/scripts/select-ci-postgres16-client.sh
          bash infra/scripts/install-ci-redis.sh
      - name: Run unchanged repository-contract prelude
        working-directory: app-source
        run: python -m pytest tests
      - name: Apply unchanged migrations to isolated database
        working-directory: app-source/backend
        env:
          DATABASE_URL: postgresql+psycopg://erp:erp@localhost:5432/erp_test
        run: alembic upgrade head
      - name: Run unchanged full suite with external bounded observer
        working-directory: app-source/backend
        env:
          DATABASE_URL: postgresql+psycopg://erp:erp@localhost:5432/erp_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/diagnostic-tools/ops/diagnostic58${PYTHONPATH:+:$PYTHONPATH}"
          export D_COMPANY_DIAGNOSTIC_OUTPUT="$RUNNER_TEMP/backend-observations"
          pytest -p dcompany_diag_plugin --junitxml="$RUNNER_TEMP/backend-observations/full-suite.xml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: diagnostic58-backend-observations
          path: ${{ runner.temp }}/backend-observations
          if-no-files-found: warn
          retention-days: 7
